<!DOCTYPE html>
<html>
<head>
  <title>Auth</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="card p-4 shadow" style="width:300px;">
  <h4 class="text-center">Login</h4>

  <input id="loginUser" class="form-control mb-2" placeholder="Username">
  <input id="loginPass" type="password" class="form-control mb-2" placeholder="Password">
  <button class="btn btn-primary w-100 mb-3" onclick="login()">Login</button>

  <h5 class="text-center">Register</h5>
  <input id="regUser" class="form-control mb-2" placeholder="Username">
  <input id="regPass" type="password" class="form-control mb-2" placeholder="Password">
  <button class="btn btn-success w-100" onclick="register()">Register</button>
</div>

<script src="script.js"></script>
</body>
</html>
